[project]
name = "near-echoes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "openai==3.49.0",
    "py-ecc==8.0.0",
    "rfc8785==0.1.4",
    "base58==2.1.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
