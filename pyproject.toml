[project]
name = "near-echoes-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["near-echoes"]

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "pyyaml>=6.0.3,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
near-echoes = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
