[workspace]
members = ["echo-nft", "echo-auction"]
resolver = "2"

[workspace.dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
near-contract-standards = "=5.30.1"
borsh = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
