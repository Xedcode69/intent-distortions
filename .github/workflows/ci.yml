name: Validate release candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: echoes_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      EXECUTION_MODE: demo
      ECHOES_PG_TEST_URL: postgresql+psycopg://postgres:echoes_ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run --locked pytest backend/tests -q
      - run: uv run --locked python scripts/run_demo_epoch.py
      - run: uv run --locked python scripts/verify_epoch.py
      - run: uv run --locked python scripts/validate_deployment.py
      - run: npm ci
        working-directory: signer
      - run: node --test demo/core.test.mjs signer/signer.test.mjs
      - run: node --experimental-strip-types --test frontend/tests/proxy.test.mjs
      - run: node --experimental-strip-types --test frontend/tests/economy.test.mjs
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          APP_PROFILE: production
      - run: node scripts/package-demo.mjs
      - run: docker build -f backend/Dockerfile -t echoes-api:ci .
      - run: docker build -f frontend/Dockerfile -t echoes-web:ci .
      - run: docker build -f demo/Dockerfile -t echoes-demo:ci .
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked python scripts/build_contracts.py --test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
        working-directory: contracts/integration
      - run: npm test
        working-directory: contracts/integration
        env:
          SANDBOX_ARTIFACT_URL: https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-candidate
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
  bundles:
    needs: [application, contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm-candidate
          path: contracts/target/wasm32-unknown-unknown/release
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
      - run: uv sync --locked
      - run: uv run --locked python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: separate-release-deliverables
          path: |
            dist/*.zip
            dist/*.manifest.json
