previews:
  generation: 'off'
services:
- type: web
  name: intent-distortions-testnet
  runtime: docker
  region: frankfurt
  plan: standard
  numInstances: 1
  autoDeployTrigger: 'off'
  dockerfilePath: ./backend/Dockerfile
  dockerContext: .
  dockerCommand: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
  preDeployCommand: /app/.venv/bin/alembic -c backend/alembic.ini upgrade head
  healthCheckPath: /readyz
  disk:
    name: weekly-source-archive
    mountPath: /app/data
    sizeGB: 10
  envVars:
  - key: APP_ENV
    value: production
  - key: EXECUTION_MODE
    value: live
  - key: SERVICE_ROLE
    value: combined
  - key: ECHOES_ROOT
    value: /app
  - key: DATA_DIR
    value: /app/data
  - key: STORAGE_PROVIDER
    value: local_content_addressed
  - key: NEAR_NETWORK
    value: testnet
  - key: SCHEDULER_ENABLED
    value: 'true'
  - key: ENABLE_CHAIN_WRITES
    value: 'false'
  - key: SIGNER_KEY_FILE
    value: /etc/secrets/near-worker.json
  - key: ALLOW_AI_FALLBACK
    value: 'false'
  - key: MARKETPLACE_CROSSCHAIN_ENABLED
    value: 'false'
  - key: PROTOCOL_ID
    value: intent-distortions-testnet-weekly-v1
  - key: FIRST_RELEASE_SUNDAY
    value: '2026-11-15'
  - key: GENESIS_CHECKPOINT
    value: '1794097030'
  - key: GENESIS_CHECKPOINT_NS
    value: '1794097030218994184'
  - key: ONCHAIN_ART_CONTRACT
    value: art-v1.id-operator.testnet
  - key: ONCHAIN_ART_TOKEN_ID
    value: ONCHAIN-PROTOTYPE-000001
  - key: EXPECTED_ONCHAIN_ART_CODE_HASH
    value: d9bac8e086fc4a43851abec3d954cf77f1cf7e04a101f369ae085d916e347d6a
  - key: NEAR_MINTER_ACCOUNT
    value: id-operator.testnet
  - key: NEAR_CREATOR_ACCOUNT
    value: id-team.testnet
  - key: NEAR_TREASURY_ACCOUNT
    value: id-treasury.testnet
  - key: NEAR_NFT_CONTRACT
    value: weekly-nft.id-operator.testnet
  - key: NEAR_AUCTION_CONTRACT
    value: weekly-auction.id-operator.testnet
  - key: NEAR_MARKET_CONTRACT
    value: weekly-market.id-operator.testnet
  - key: ADMIN_TOKEN
    generateValue: true
  - key: EXPECTED_NFT_CODE_HASH
    sync: false
  - key: EXPECTED_AUCTION_CODE_HASH
    sync: false
  - key: EXPECTED_MARKET_CODE_HASH
    sync: false
  - key: EXPECTED_VAULT_CODE_HASH
    sync: false
  - key: PUBLIC_ORIGIN
    sync: false
  - key: CORS_ORIGIN
    sync: false
  - key: ALLOWED_HOSTS
    sync: false
  - key: NEAR_RPC_URL
    sync: false
  - key: NEAR_MAINNET_RPC_URL
    sync: false
  - key: NEAR_INTENTS_PARTNER_JWT
    sync: false
  - key: NEAR_AI_API_KEY
    sync: false
  - key: NEAR_AI_TEXT_MODEL
    sync: false
  - key: DATABASE_URL
    fromDatabase:
      name: intent-distortions-testnet-db
      property: connectionString
databases:
- name: intent-distortions-testnet-db
  region: frankfurt
  plan: basic-1gb
  postgresMajorVersion: '18'
  diskSizeGB: 10
  databaseName: distortions
  user: distortions
  ipAllowList: []
